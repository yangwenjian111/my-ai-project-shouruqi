<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预算 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page app-page active">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>
      
      <div class="content">
        <!-- 页面标题 -->
        <div class="header">
          <h2 class="page-title">预算</h2>
        </div>
        
        <!-- 本月总预算卡片 -->
        <div class="budget-main-card">
          <div class="card-header">
            <span class="card-title">本月总预算</span>
            <span class="month-selector">9月</span>
          </div>
          <div class="budget-ring-container">
            <div class="ring-chart">
              <svg viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="50" fill="none" stroke="#FDDDE6" stroke-width="12"/>
                <circle cx="60" cy="60" r="50" fill="none" stroke="#F2A6C0" stroke-width="12" 
                  stroke-dasharray="289 314" stroke-dashoffset="78" stroke-linecap="round" 
                  transform="rotate(-90 60 60)"/>
              </svg>
            </div>
            <div class="budget-data">
              <div class="data-row">
                <span class="data-label">已使用</span>
                <span class="data-value expense">¥5,920</span>
              </div>
              <div class="data-row">
                <span class="data-label">剩余</span>
                <span class="data-value income">¥80</span>
              </div>
              <div class="data-row">
                <span class="data-label">预算</span>
                <span class="data-value">¥6,000</span>
              </div>
            </div>
          </div>
        </div>
        
        <!-- 分类预算 -->
        <div class="section-header">
          <h3 class="section-title">分类预算</h3>
          <a href="#" class="view-all">管理 ›</a>
        </div>
        
        <div class="category-budget-list">
          <!-- 餐饮 -->
          <div class="cat-budget-item">
            <div class="cat-icon" style="background:#FDDDE6">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 8l2-4h6l2 4v7a1 1 0 01-1 1H6a1 1 0 01-1-1V8z" fill="#E8849E"/></svg>
            </div>
            <div class="cat-info">
              <div class="cat-name">餐饮</div>
              <div class="cat-progress-bar">
                <div class="progress-fill warn" style="width:87%"></div>
              </div>
            </div>
            <div class="cat-amount">¥2,600/¥3,000</div>
          </div>
          
          <!-- 购物 -->
          <div class="cat-budget-item">
            <div class="cat-icon" style="background:#FDDDE6">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 5h10l2 10H3L5 5z" fill="#E8849E"/><path d="M7 5V3a3 3 0 016 0v2" stroke="#E8849E" stroke-width="1.5" fill="none"/></svg>
            </div>
            <div class="cat-info">
              <div class="cat-name">购物</div>
              <div class="cat-progress-bar">
                <div class="progress-fill safe" style="width:59%"></div>
              </div>
            </div>
            <div class="cat-amount">¥1,480/¥2,500</div>
          </div>
          
          <!-- 交通 -->
          <div class="cat-budget-item">
            <div class="cat-icon" style="background:#FDDDE6">
              <svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="8" width="14" height="8" rx="2" fill="#E8849E"/><circle cx="6" cy="17" r="2" fill="#E8849E"/><circle cx="14" cy="17" r="2" fill="#E8849E"/></svg>
            </div>
            <div class="cat-info">
              <div class="cat-name">交通</div>
              <div class="cat-progress-bar">
                <div class="progress-fill warn" style="width:82%"></div>
              </div>
            </div>
            <div class="cat-amount">¥980/¥1,200</div>
          </div>
        </div>
      </div>
      
      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-pill">
          <a href="dashboard.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 01-1 1H4a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            <span>首页</span>
          </a>
          <a href="transactions.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>账单</span>
          </a>
          <a href="statistics.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>统计</span>
          </a>
          <a href="budget.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" fill="currentColor"/><line x1="4" y1="11" x2="20" y2="11" stroke="#fff" stroke-width="1.5"/></svg>
            <span>预算</span>
          </a>
          <a href="settings.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>设置</span>
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
