<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page app-page active">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>
      
      <div class="content">
        <!-- 顶部问候 -->
        <div class="header">
          <div>
            <h2 class="greeting" id="greeting-text">早上好，记账达人</h2>
            <p class="date">9月22日 周一</p>
          </div>
          <div class="avatar">
            <svg id="user-avatar" width="36" height="36" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="12" fill="#FDDDE6"/>
              <circle cx="12" cy="10" r="4" fill="#E8849E"/>
              <ellipse cx="12" cy="18" rx="7" ry="5" fill="#E8849E"/>
              <path d="M10 9a1 1 0 012 0M10 11c0 1 1 1.5 2 1.5s2-.5 2-1.5" stroke="#4A3728" stroke-width="0.75" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
        
        <!-- 本月概览卡片 -->
        <div class="overview-card">
          <div class="card-header">
            <span class="card-title">本月概览</span>
            <span class="month-selector">9月 </span>
          </div>
          <div class="overview-amount">¥2,580.00</div>
          <div class="overview-stats">
            <div class="stat-item">
              <div class="stat-label">收入</div>
              <div class="stat-value income">+¥8,500.00</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">支出</div>
              <div class="stat-value expense">-¥5,920.00</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">结余</div>
              <div class="stat-value balance">¥2,580.00</div>
            </div>
          </div>
          <div class="budget-progress">
            <div class="progress-info">
              <span>月度预算 ¥6,000</span>
              <span class="progress-pct">已用 92%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:92%"></div>
            </div>
          </div>
        </div>
        
        <!-- 近期账单 -->
        <div class="recent-section">
          <div class="section-header">
            <span class="section-title">近期账单</span>
            <a href="#" class="view-all">查看全部 ›</a>
          </div>
          
          <div class="tx-date-group">
            <div class="tx-date">今天</div>
            <div class="tx-summary">支出 ¥104.00</div>
          </div>
          
          <div class="transaction-list">
            <div class="transaction-item">
              <div class="tx-icon" style="background:#FDDDE6">
                <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 8l2-4h6l2 4v7a1 1 0 01-1 1H6a1 1 0 01-1-1V8z" fill="#E8849E"/></svg>
              </div>
              <div class="tx-info">
                <div class="tx-name">餐饮</div>
                <div class="tx-note">午餐 · 拉面</div>
              </div>
              <div class="tx-amount expense">-¥32.00</div>
            </div>
            
            <div class="transaction-item">
              <div class="tx-icon" style="background:#FDDDE6">
                <svg width="20" height="20" viewBox="0 0 20 20"><rect x="3" y="8" width="14" height="8" rx="2" fill="#E8849E"/><circle cx="6" cy="17" r="2" fill="#E8849E"/><circle cx="14" cy="17" r="2" fill="#E8849E"/></svg>
              </div>
              <div class="tx-info">
                <div class="tx-name">交通</div>
                <div class="tx-note">地铁</div>
              </div>
              <div class="tx-amount expense">-¥12.00</div>
            </div>
            
            <div class="transaction-item">
              <div class="tx-icon" style="background:#FDDDE6">
                <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 5h10l2 10H3L5 5z" fill="#E8849E"/><path d="M7 5V3a3 3 0 016 0v2" stroke="#E8849E" stroke-width="1.5" fill="none"/></svg>
              </div>
              <div class="tx-info">
                <div class="tx-name">购物</div>
                <div class="tx-note">日用品</div>
              </div>
              <div class="tx-amount expense">-¥60.00</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- FAB 按钮 -->
      <button class="fab" onclick="showQuickAdd()">+</button>
      
      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-pill">
          <a href="dashboard.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 01-1 1H4a1 1 0 01-1-1v-9z" fill="currentColor"/></svg>
            <span>首页</span>
          </a>
          <a href="transactions.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>账单</span>
          </a>
          <a href="statistics.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>统计</span>
          </a>
          <a href="budget.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="4" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>预算</span>
          </a>
          <a href="settings.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>设置</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 快速记账面板 -->
  <div class="sheet-overlay" id="quick-add-sheet" onclick="hideQuickAdd()">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="type-tabs">
          <button class="type-tab active" data-type="expense">支出</button>
          <button class="type-tab" data-type="income">收入</button>
        </div>
      </div>
      <div class="amount-display">
        <span class="amount-prefix">¥</span>
        <span class="amount-value" id="quick-amount">0.00</span>
      </div>
      <div class="category-title">选择分类</div>
      <div class="category-grid">
        <div class="cat-item active">
          <button class="cat-icon-btn">
            <svg width="28" height="28" viewBox="0 0 28 28"><path d="M6 14h16M10 10v8M18 10v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><ellipse cx="14" cy="14" rx="10" ry="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <span class="cat-label">餐饮</span>
        </div>
        <div class="cat-item">
          <button class="cat-icon-btn">
            <svg width="28" height="28" viewBox="0 0 28 28"><rect x="4" y="10" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="4" y1="15" x2="24" y2="15" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="22" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="22" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          </button>
          <span class="cat-label">交通</span>
        </div>
        <div class="cat-item">
          <button class="cat-icon-btn">
            <svg width="28" height="28" viewBox="0 0 28 28"><path d="M8 8h12l2 12H6L8 8z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 8V6a4 4 0 018 0v2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </button>
          <span class="cat-label">购物</span>
        </div>
        <div class="cat-item">
          <button class="cat-icon-btn">
            <svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 10v4l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <span class="cat-label">娱乐</span>
        </div>
      </div>
      
      <!-- 日期备注行 -->
      <div class="date-note-row">
        <button class="date-btn">9月22日</button>
        <input type="text" class="note-input" placeholder="添加备注…">
      </div>
      
      <!-- 数字键盘 -->
      <div class="numpad">
        <button type="button" class="num-btn" onclick="inputNum('1')">1</button>
        <button type="button" class="num-btn" onclick="inputNum('2')">2</button>
        <button type="button" class="num-btn" onclick="inputNum('3')">3</button>
        <button type="button" class="num-btn" onclick="inputNum('4')">4</button>
        <button type="button" class="num-btn" onclick="inputNum('5')">5</button>
        <button type="button" class="num-btn" onclick="inputNum('6')">6</button>
        <button type="button" class="num-btn" onclick="inputNum('7')">7</button>
        <button type="button" class="num-btn" onclick="inputNum('8')">8</button>
        <button type="button" class="num-btn" onclick="inputNum('9')">9</button>
        <button type="button" class="num-btn" onclick="inputNum('.')">.</button>
        <button type="button" class="num-btn" onclick="inputNum('0')">0</button>
        <button type="button" class="num-btn delete" onclick="deleteNum()">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <path d="M6 6l8 8M14 6l-8 8" stroke="#9C8578" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      
      <button class="btn-complete" onclick="completeQuickAdd()">完成</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
