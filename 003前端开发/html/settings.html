<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page app-page active">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>
      
      <div class="content">
        <!-- 页面标题 -->
        <div class="header">
          <h2 class="page-title">设置</h2>
        </div>
        
        <!-- 用户信息卡片 -->
        <div class="settings-card user-profile">
          <div class="user-avatar">
            <svg id="settings-avatar-svg" width="48" height="48" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="24" fill="#FDDDE6"/>
              <circle cx="24" cy="20" r="8" fill="#E8849E"/>
              <ellipse cx="24" cy="40" rx="14" ry="10" fill="#E8849E"/>
              <path d="M20 18a2 2 0 014 0M20 22c0 2 2 3 4 3s4-1 4-3" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="user-info">
            <div class="user-name-input-row">
              <input type="text" class="user-name-input" id="settings-username-input" value="记账达人" readonly>
              <button class="edit-btn" id="edit-name-btn" title="编辑名字">
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M12 2l2 2-8 8H4v-2l8-8z" fill="#9C8578"/></svg>
              </button>
            </div>
            <div class="user-id">用户名：xiaojia</div>
          </div>
          <svg class="arrow-icon" width="20" height="20" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" stroke="#9C8578" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        </div>
        
        <!-- 分类管理 -->
        <div class="settings-card">
          <div class="card-item">
            <div class="item-left">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 6l3-3h6l3 3v10a1 1 0 01-1 1H5a1 1 0 01-1-1V6z" fill="none" stroke="#E8849E" stroke-width="1.5"/><line x1="4" y1="10" x2="16" y2="10" stroke="#E8849E" stroke-width="1.5"/></svg>
              <span>分类管理</span>
            </div>
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" stroke="#9C8578" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
        
        <!-- 记账偏好 -->
        <div class="settings-card">
          <div class="card-item">
            <div class="item-left">
              <svg width="20" height="20" viewBox="0 0 20 20"><line x1="4" y1="6" x2="16" y2="6" stroke="#E8849E" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="10" x2="16" y2="10" stroke="#E8849E" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="14" x2="16" y2="14" stroke="#E8849E" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>记账偏好</span>
            </div>
            <select class="preference-select">
              <option selected>支出</option>
              <option>收入</option>
            </select>
          </div>
        </div>
        
        <!-- 数据账单导出 -->
        <div class="settings-card">
          <div class="card-item">
            <div class="item-left">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 4v10M6 10l4 4 4-4" stroke="#E8849E" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 14v2a1 1 0 001 1h10a1 1 0 001-1v-2" stroke="#E8849E" stroke-width="1.5" fill="none"/></svg>
              <span>数据账单导出</span>
            </div>
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" stroke="#9C8578" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          </div>
        </div>
        
        <!-- 关于 -->
        <div class="settings-card">
          <div class="card-item">
            <div class="item-left">
              <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="#E8849E" stroke-width="1.5"/><path d="M10 7v3M10 13v0.5" stroke="#E8849E" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>关于</span>
            </div>
            <div class="item-right">
              <span class="version-text">v1.0.0</span>
              <svg class="arrow-icon" width="20" height="20" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" stroke="#9C8578" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>

        <!-- 退出登录按钮 -->
        <div style="margin: 24px 16px 16px;">
          <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
      </div>
      
      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-pill">
          <a href="dashboard.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 01-1 1H4a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            <span>首页</span>
          </a>
          <a href="transactions.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>账单</span>
          </a>
          <a href="statistics.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>统计</span>
          </a>
          <a href="budget.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="4" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>预算</span>
          </a>
          <a href="settings.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>设置</span>
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
