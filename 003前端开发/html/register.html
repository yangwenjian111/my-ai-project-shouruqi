<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page login-page active">
      <div class="login-container">
        <div class="login-logo">
          <div class="logo-icon">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <rect x="6" y="10" width="24" height="16" rx="3" stroke="white" stroke-width="2"/>
              <line x1="6" y1="16" x2="30" y2="16" stroke="white" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <h1 class="login-title">创建账号</h1>
        <p class="login-welcome">加入我们，开始轻松记账</p>
        
        <div class="login-form">
          <!-- 头像选择器 -->
          <div class="avatar-selector">
            <div class="selector-title">选择头像</div>
            <div class="avatar-options">
              <div class="avatar-option selected" onclick="selectAvatar(this, 'pink')">
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="24" fill="#FDDDE6"/>
                  <circle cx="24" cy="20" r="8" fill="#E8849E"/>
                  <ellipse cx="24" cy="40" rx="14" ry="10" fill="#E8849E"/>
                  <path d="M20 18a2 2 0 014 0M20 22c0 2 2 3 4 3s4-1 4-3" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="avatar-option" onclick="selectAvatar(this, 'orange')">
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="24" fill="#FFE5C2"/>
                  <circle cx="24" cy="20" r="8" fill="#FFD6A5"/>
                  <ellipse cx="24" cy="40" rx="14" ry="10" fill="#FFD6A5"/>
                  <path d="M20 18a2 2 0 014 0M20 22c0 2 2 3 4 3s4-1 4-3" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="avatar-option" onclick="selectAvatar(this, 'mint')">
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="24" fill="#D5F5E8"/>
                  <circle cx="24" cy="20" r="8" fill="#B8E6D0"/>
                  <ellipse cx="24" cy="40" rx="14" ry="10" fill="#B8E6D0"/>
                  <path d="M20 18a2 2 0 014 0M20 22c0 2 2 3 4 3s4-1 4-3" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="avatar-option" onclick="selectAvatar(this, 'lavender')">
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="24" fill="#E8DFF5"/>
                  <circle cx="24" cy="20" r="8" fill="#C9B8E6"/>
                  <ellipse cx="24" cy="40" rx="14" ry="10" fill="#C9B8E6"/>
                  <path d="M20 18a2 2 0 014 0M20 22c0 2 2 3 4 3s4-1 4-3" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="avatar-option" onclick="selectAvatar(this, 'blue')">
                <svg width="48" height="48" viewBox="0 0 48 48">
                  <circle cx="24" cy="24" r="24" fill="#D5EEF5"/>
                  <circle cx="24" cy="20" r="8" fill="#A8D8EA"/>
                  <ellipse cx="24" cy="40" rx="14" ry="10" fill="#A8D8EA"/>
                  <path d="M20 18a2 2 0 014 0M20 22c0 2 2 3 4 3s4-1 4-3" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="input-group">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7" r="4" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M3 17c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="#9C8578" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" placeholder="用户名（3-20位）" id="reg-username">
          </div>
          <div class="input-group">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7" r="4" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M3 17c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="#9C8578" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" placeholder="昵称（可选）" id="reg-nickname">
          </div>
          <div class="input-group">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <rect x="5" y="9" width="10" height="8" rx="1.5" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M7 9V6a3 3 0 016 0v3" stroke="#9C8578" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="password" placeholder="密码（6-20位）" id="reg-password" oninput="checkPasswordStrength()">
          </div>
          
          <!-- 密码强度指示器 -->
          <div class="password-strength" id="password-strength">
            <span class="strength-text">密码强度：弱</span>
            <div class="strength-bar">
              <div class="strength-fill weak"></div>
              <div class="strength-fill"></div>
              <div class="strength-fill"></div>
            </div>
          </div>
          
          <div class="input-group">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <rect x="5" y="9" width="10" height="8" rx="1.5" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M7 9V6a3 3 0 016 0v3" stroke="#9C8578" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="password" placeholder="确认密码" id="reg-confirm">
          </div>
          <button class="btn-login" onclick="handleRegister()">注册</button>
        </div>
        
        <div class="login-footer">
          <a href="login.html" class="link-register">已有账号？去登录</a>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
