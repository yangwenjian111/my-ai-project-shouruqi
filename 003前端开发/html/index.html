<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常记账 - 应用入口</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #FDDDE6 0%, #FFF8F0 100%);
      font-family: 'Noto Sans SC', sans-serif;
    }
    .entry-container {
      text-align: center;
      padding: 40px 24px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(242, 166, 192, 0.2);
      max-width: 400px;
      width: 90%;
    }
    .app-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #F2A6C0, #FFD6A5);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
    }
    h1 {
      color: #4A3728;
      margin-bottom: 8px;
      font-size: 24px;
    }
    p {
      color: #9C8578;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary, .btn-secondary {
      padding: 14px 32px;
      color: white;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      text-decoration: none;
      display: inline-block;
      width: 100%;
      text-align: center;
    }
    .btn-primary {
      background: linear-gradient(135deg, #F2A6C0, #FFD6A5);
      border: none;
    }
    .btn-secondary {
      background: white;
      color: #E8849E;
      border: 2px solid #F2A6C0;
    }
    .btn-primary:hover {
      transform: scale(1.05);
    }
    .btn-secondary:hover {
      background: #FDDDE6;
    }
    .tips {
      margin-top: 24px;
      padding: 16px;
      background: #FFF8F0;
      border-radius: 12px;
      font-size: 12px;
      color: #9C8578;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="entry-container">
    <div class="app-logo">📝</div>
    <h1>日常记账</h1>
    <p>轻松管理你的每一笔收支</p>
    
    <div class="btn-group">
      <a href="login.html" class="btn-primary">登录</a>
      <a href="register.html" class="btn-secondary">注册</a>
    </div>
    
    <div class="tips">
      <strong>💡 提示：</strong><br>
      • 点击"登录"进入登录页面<br>
      • 点击"注册"创建新账号<br>
      • 登录成功后自动跳转到首页<br>
      • 底部导航可在各页面间切换
    </div>
  </div>
</body>
</html>
