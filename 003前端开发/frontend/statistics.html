<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page app-page active">
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>
      
      <div class="content">
        <div class="header">
          <h2 class="page-title">统计</h2>
        </div>
        
        <!-- 时间切换 -->
        <div class="time-tabs">
          <button class="time-tab">周</button>
          <button class="time-tab active">月</button>
          <button class="time-tab">年</button>
        </div>
        
        <!-- 支出趋势 -->
        <div class="chart-card">
          <div class="card-header">
            <span class="card-title">支出趋势</span>
            <span class="card-subtitle">总支出 ¥0.00</span>
          </div>
          <div id="lineChart" style="width:100%;height:200px;"></div>
        </div>
        
        <!-- 分类占比 -->
        <div class="chart-card">
          <div class="card-header">
            <span class="card-title">分类占比</span>
          </div>
          <div id="pieChart" style="width:100%;height:220px;"></div>
        </div>
        
        <!-- 消费排行 -->
        <div class="chart-card">
          <div class="card-title">消费排行</div>
          <div class="rank-list">
            <!-- 动态渲染 -->
          </div>
        </div>
      </div>
      
      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-pill">
          <a href="dashboard.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 01-1 1H4a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            <span>首页</span>
          </a>
          <a href="transactions.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>账单</span>
          </a>
          <a href="statistics.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M12 7v5l3 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>统计</span>
          </a>
          <a href="settings.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>设置</span>
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
