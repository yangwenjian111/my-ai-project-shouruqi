<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page app-page active">
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>
      
      <div class="content">
        <!-- 顶部问候 -->
        <div class="header">
          <div>
            <h2 class="greeting" id="greeting-text">早上好，记账达人</h2>
            <p class="date">9月22日 周一</p>
          </div>
          <div class="avatar">
            <svg id="user-avatar" width="36" height="36" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="12" fill="#FDDDE6"/>
              <circle cx="12" cy="10" r="4" fill="#E8849E"/>
              <ellipse cx="12" cy="18" rx="7" ry="5" fill="#E8849E"/>
            </svg>
          </div>
        </div>
        
        <!-- 本月概览卡片 -->
        <div class="overview-card">
          <div class="card-header">
            <span class="card-title">本月概览</span>
            <span class="month-selector">9月 </span>
          </div>
          <div class="overview-amount">¥0.00</div>
          <div class="overview-stats">
            <div class="stat-item">
              <div class="stat-label">储备金</div>
              <div class="stat-value income">+¥0.00</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">支出</div>
              <div class="stat-value expense">-¥0.00</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">结余</div>
              <div class="stat-value balance">¥0.00</div>
            </div>
          </div>
          <div class="budget-progress">
            <div class="progress-info">
              <span>储备金 ¥0.00</span>
              <span class="progress-pct">已用 0%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:0%"></div>
            </div>
          </div>
        </div>
        
        <!-- 近期账单 -->
        <div class="recent-section">
          <div class="section-header">
            <span class="section-title">近期账单</span>
            <a href="transactions.html" class="view-all">查看全部 ›</a>
          </div>
          
          <div class="tx-date-group">
            <div class="tx-date">今天</div>
            <div class="tx-summary">支出 ¥0.00</div>
          </div>
          
          <div class="transaction-list">
            <!-- 动态渲染 -->
          </div>
        </div>
      </div>
      
      <!-- FAB 按钮 -->
      <button class="fab" onclick="showQuickAdd()">+</button>
      
      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-pill">
          <a href="dashboard.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 01-1 1H4a1 1 0 01-1-1v-9z" fill="currentColor"/></svg>
            <span>首页</span>
          </a>
          <a href="transactions.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="8" y1="9" x2="16" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="13" x2="14" y2="13" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>账单</span>
          </a>
          <a href="statistics.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>统计</span>
          </a>
          <a href="settings.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>设置</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 快速记账面板 -->
  <div class="sheet-overlay" id="quick-add-sheet" onclick="hideQuickAdd()">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="type-tabs">
          <button class="type-tab active" data-type="expense">支出</button>
          <button class="type-tab" data-type="reserve">储备金</button>
        </div>
      </div>
      <div class="amount-display">
        <span class="amount-prefix">¥</span>
        <span class="amount-value" id="quick-amount">0.00</span>
      </div>
      <div class="category-title">选择分类</div>
      <div class="category-grid">
        <!-- 动态渲染 -->
      </div>
      
      <!-- 日期备注行 -->
      <div class="date-note-row">
        <button class="date-btn">9月22日</button>
        <input type="text" class="note-input" placeholder="添加备注…">
      </div>
      
      <!-- 数字键盘 -->
      <div class="numpad">
        <button type="button" class="num-btn" onclick="inputNum('1')">1</button>
        <button type="button" class="num-btn" onclick="inputNum('2')">2</button>
        <button type="button" class="num-btn" onclick="inputNum('3')">3</button>
        <button type="button" class="num-btn" onclick="inputNum('4')">4</button>
        <button type="button" class="num-btn" onclick="inputNum('5')">5</button>
        <button type="button" class="num-btn" onclick="inputNum('6')">6</button>
        <button type="button" class="num-btn" onclick="inputNum('7')">7</button>
        <button type="button" class="num-btn" onclick="inputNum('8')">8</button>
        <button type="button" class="num-btn" onclick="inputNum('9')">9</button>
        <button type="button" class="num-btn" onclick="inputNum('.')">.</button>
        <button type="button" class="num-btn" onclick="inputNum('0')">0</button>
        <button type="button" class="num-btn delete" onclick="deleteNum()">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <path d="M6 6l8 8M14 6l-8 8" stroke="#9C8578" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      
      <button class="btn-complete" onclick="completeQuickAdd()">完成</button>
    </div>
  </div>

  <!-- 储备金设置弹窗 -->
  <div class="sheet-overlay" id="reserve-modal" onclick="hideReserveModal()">
    <div class="reserve-modal-content" onclick="event.stopPropagation()">
      <div class="reserve-modal-header">
        <h3>设置本月储备金</h3>
        <p class="reserve-modal-desc">储备金是您每月的固定存入金额，用于计算结余</p>
      </div>
      <div class="reserve-input-group">
        <span class="reserve-prefix">¥</span>
        <input type="number" id="reserve-amount-input" placeholder="请输入金额" class="reserve-input" step="0.01" min="0">
      </div>
      <button class="btn-complete" onclick="submitReserve()">确认设置</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
