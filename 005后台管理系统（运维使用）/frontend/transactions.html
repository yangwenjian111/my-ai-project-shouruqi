<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账单数据 - 后台管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><h1>后台管理系统</h1><p>运维管理平台</p></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>数据总览</a>
        <a href="users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>用户管理</a>
        <a href="reserve-funds.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>储备金管理</a>
        <a href="transactions.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>账单数据</a>
        <a href="categories.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>分类管理</a>
      </nav>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left"><span class="topbar-title">账单数据</span></div>
        <div class="topbar-right">
          <span class="topbar-user"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="admin-name">管理员</span></span>
          <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
      </header>
      <div class="page-content">
        <!-- 筛选栏 -->
        <div class="filter-bar">
          <input type="text" class="form-input" id="user-filter" placeholder="用户ID..." style="width:120px">
          <select class="form-select" id="type-filter" style="width:120px">
            <option value="">全部类型</option>
            <option value="expense">支出</option>
            <option value="reserve">储备金</option>
          </select>
          <input type="month" class="form-input" id="month-filter" style="width:160px">
          <select class="form-select" id="page-size-select" style="width:120px">
            <option value="10">10条/页</option>
            <option value="20" selected>20条/页</option>
            <option value="50">50条/页</option>
          </select>
        </div>

        <!-- 汇总 -->
        <div class="summary-row" id="summary-row" style="display:none">
          <div class="summary-item"><span class="label">总金额：</span><span class="value" id="total-amount">¥0.00</span></div>
          <div class="summary-item"><span class="label">总笔数：</span><span class="value" id="total-count">0</span></div>
        </div>

        <!-- 表格 -->
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th><th>用户名</th><th>昵称</th><th>分类</th><th>类型</th><th>金额</th><th>账单日期</th><th>备注</th><th>创建时间</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="tx-tbody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>账单详情</h3>
        <button class="modal-close" onclick="closeDetailModal()">&times;</button>
      </div>
      <div class="modal-body" id="detail-content"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw '';
    var currentPage = 1;
    var pageSize = 20;

    function loadTransactions() {
      var tbody = document.getElementById('tx-tbody');
      showLoading(tbody);
      var url = '/transactions?page=' + currentPage + '&pageSize=' + pageSize;
      var userId = document.getElementById('user-filter').value.trim();
      var type = document.getElementById('type-filter').value;
      var month = document.getElementById('month-filter').value;
      if (userId) url += '&userId=' + userId;
      if (type) url += '&type=' + type;
      if (month) url += '&month=' + month;

      apiFetch(url).then(function (data) {
        document.getElementById('summary-row').style.display = 'flex';
        document.getElementById('total-amount').textContent = formatAmount(data.totalAmount);
        document.getElementById('total-count').textContent = data.total;

        if (data.list.length === 0) { showEmpty(tbody, '暂无账单'); document.getElementById('pagination').innerHTML = ''; return; }
        var html = '';
        data.list.forEach(function (t) {
          html += '<tr>';
          html += '<td>' + t.id + '</td>';
          html += '<td>' + (t.username || '-') + '</td>';
          html += '<td>' + (t.nickname || '-') + '</td>';
          html += '<td>' + t.categoryName + '</td>';
          html += '<td><span class="badge ' + (t.type === 'expense' ? 'badge-danger' : 'badge-warning') + '">' + formatType(t.type) + '</span></td>';
          html += '<td class="' + (t.type === 'expense' ? 'amount-expense' : 'amount-reserve') + '">' + formatAmount(t.amount) + '</td>';
          html += '<td>' + t.transactionDate + '</td>';
          html += '<td>' + (t.note || '-') + '</td>';
          html += '<td>' + formatDate(t.createdAt) + '</td>';
          html += '<td><button class="btn-link" onclick="viewDetail(' + t.id + ')">详情</button></td>';
          html += '</tr>';
        });
        tbody.innerHTML = html;
        renderPagination(document.getElementById('pagination'), data.total, data.page, data.pageSize, function (p) {
          currentPage = p;
          loadTransactions();
        });
      }).catch(function (err) {
        showEmpty(tbody, '加载失败：' + err.message);
      });
    }

    function viewDetail(id) {
      apiFetch('/transactions/' + id).then(function (data) {
        var html = '<div class="detail-grid">';
        html += detailItem('账单ID', data.id);
        html += detailItem('用户名', data.username || '-');
        html += detailItem('昵称', data.nickname || '-');
        html += detailItem('分类', data.categoryName);
        html += detailItem('类型', '<span class="badge ' + (data.type === 'expense' ? 'badge-danger' : 'badge-warning') + '">' + formatType(data.type) + '</span>');
        html += detailItem('金额', '<span class="' + (data.type === 'expense' ? 'amount-expense' : 'amount-reserve') + '">' + formatAmount(data.amount) + '</span>');
        html += detailItem('账单日期', data.transactionDate);
        html += detailItem('备注', data.note || '-');
        html += detailItem('创建时间', formatDate(data.createdAt));
        html += detailItem('更新时间', formatDate(data.updatedAt));
        html += '</div>';
        document.getElementById('detail-content').innerHTML = html;
        document.getElementById('detail-modal').classList.add('show');
      }).catch(function (err) { showToast(err.message, 'error'); });
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.remove('show');
    }

    function detailItem(label, value) {
      return '<div class="detail-item" style="margin-bottom:12px"><span class="label">' + label + '</span><span class="value">' + value + '</span></div>';
    }

    document.getElementById('user-filter').addEventListener('input', debounce(function () { currentPage = 1; loadTransactions(); }, 300));
    document.getElementById('type-filter').addEventListener('change', function () { currentPage = 1; loadTransactions(); });
    document.getElementById('month-filter').addEventListener('change', function () { currentPage = 1; loadTransactions(); });
    document.getElementById('page-size-select').addEventListener('change', function () { pageSize = Number(this.value); currentPage = 1; loadTransactions(); });

    loadTransactions();
  </script>
</body>
</html>
