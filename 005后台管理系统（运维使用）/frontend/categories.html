<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类管理 - 后台管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><h1>后台管理系统</h1><p>运维管理平台</p></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>数据总览</a>
        <a href="users.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>用户管理</a>
        <a href="reserve-funds.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>储备金管理</a>
        <a href="transactions.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>账单数据</a>
        <a href="categories.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>分类管理</a>
      </nav>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left"><span class="topbar-title">分类管理</span></div>
        <div class="topbar-right">
          <span class="topbar-user"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="admin-name">管理员</span></span>
          <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
      </header>
      <div class="page-content">
        <!-- 操作栏 -->
        <div class="filter-bar">
          <select class="form-select" id="type-filter" style="width:140px">
            <option value="">全部类型</option>
            <option value="expense">支出</option>
            <option value="reserve">储备金</option>
          </select>
          <button class="btn btn-primary" onclick="openAddModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新增分类
          </button>
        </div>

        <!-- 表格 -->
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th><th>图标</th><th>名称</th><th>类型</th><th>主题色</th><th>底色</th><th>排序</th><th>关联账单数</th><th>创建时间</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="cat-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- 新增分类弹窗 -->
  <div class="modal-overlay" id="add-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>新增分类</h3>
        <button class="modal-close" onclick="closeAddModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">类型 <span style="color:var(--danger)">*</span></label>
          <select class="form-select" id="add-type">
            <option value="expense">支出</option>
            <option value="reserve">储备金</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">名称 <span style="color:var(--danger)">*</span></label>
          <input type="text" class="form-input" id="add-name" placeholder="分类名称（1-10字）" maxlength="10">
        </div>
        <div class="form-group">
          <label class="form-label">图标（emoji）</label>
          <input type="text" class="form-input" id="add-icon" placeholder="默认 📌" maxlength="2">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group">
            <label class="form-label">主题色</label>
            <input type="color" class="form-input" id="add-color" value="#F2A6C0" style="height:38px;padding:4px">
          </div>
          <div class="form-group">
            <label class="form-label">底色</label>
            <input type="color" class="form-input" id="add-bgcolor" value="#FDDDE6" style="height:38px;padding:4px">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">排序</label>
          <input type="number" class="form-input" id="add-sort" value="0" min="0">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" id="add-submit-btn" onclick="submitAdd()">确认创建</button>
      </div>
    </div>
  </div>

  <!-- 删除确认 -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box">
      <h4>确认删除</h4>
      <p id="confirm-message">确定要删除此分类吗？</p>
      <div class="confirm-actions">
        <button class="btn btn-outline">取消</button>
        <button class="btn btn-danger">确认删除</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw '';
    var allCategories = [];

    function loadCategories() {
      var tbody = document.getElementById('cat-tbody');
      showLoading(tbody);

      apiFetch('/categories').then(function (data) {
        allCategories = data;
        renderTable();
      }).catch(function (err) {
        showEmpty(tbody, '加载失败：' + err.message);
      });
    }

    function renderTable() {
      var tbody = document.getElementById('cat-tbody');
      var typeFilter = document.getElementById('type-filter').value;
      var list = typeFilter ? allCategories.filter(function (c) { return c.type === typeFilter; }) : allCategories;

      if (list.length === 0) { showEmpty(tbody, '暂无分类'); return; }

      var html = '';
      list.forEach(function (c) {
        html += '<tr>';
        html += '<td>' + c.id + '</td>';
        html += '<td style="font-size:20px">' + c.icon + '</td>';
        html += '<td>' + c.name + '</td>';
        html += '<td><span class="badge ' + (c.type === 'expense' ? 'badge-danger' : 'badge-warning') + '">' + formatType(c.type) + '</span></td>';
        html += '<td><span class="color-swatch" style="background:' + c.color + '"></span>' + c.color + '</td>';
        html += '<td><span class="color-swatch" style="background:' + c.bgColor + '"></span>' + c.bgColor + '</td>';
        html += '<td>' + c.sortOrder + '</td>';
        html += '<td>' + c.txCount + '</td>';
        html += '<td>' + formatDate(c.createdAt) + '</td>';
        html += '<td><button class="btn-link" style="color:var(--danger)" onclick="deleteCategory(' + c.id + ', \'' + c.name.replace(/'/g, "\\'") + '\', ' + c.txCount + ')">删除</button></td>';
        html += '</tr>';
      });
      tbody.innerHTML = html;
    }

    function openAddModal() {
      document.getElementById('add-type').value = 'expense';
      document.getElementById('add-name').value = '';
      document.getElementById('add-icon').value = '';
      document.getElementById('add-color').value = '#F2A6C0';
      document.getElementById('add-bgcolor').value = '#FDDDE6';
      document.getElementById('add-sort').value = '0';
      document.getElementById('add-modal').classList.add('show');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.remove('show');
    }

    function submitAdd() {
      var type = document.getElementById('add-type').value;
      var name = document.getElementById('add-name').value.trim();
      var icon = document.getElementById('add-icon').value.trim();
      var color = document.getElementById('add-color').value;
      var bgColor = document.getElementById('add-bgcolor').value;
      var sortOrder = Number(document.getElementById('add-sort').value);

      if (!name) { showToast('请输入分类名称', 'error'); return; }

      var btn = document.getElementById('add-submit-btn');
      btn.disabled = true;
      btn.textContent = '创建中...';

      apiFetch('/categories', {
        method: 'POST',
        body: { type: type, name: name, icon: icon || undefined, color: color, bgColor: bgColor, sortOrder: sortOrder }
      }).then(function () {
        showToast('分类创建成功', 'success');
        closeAddModal();
        loadCategories();
      }).catch(function (err) {
        showToast(err.message || '创建失败', 'error');
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = '确认创建';
      });
    }

    function deleteCategory(id, name, txCount) {
      var msg = txCount > 0
        ? '该分类「' + name + '」下有 ' + txCount + ' 条账单记录，无法删除。'
        : '确定要删除分类「' + name + '」吗？删除后所有用户将看不到此分类。';

      if (txCount > 0) {
        showToast(msg, 'error');
        return;
      }

      showConfirm('删除分类', msg, function () {
        apiFetch('/categories/' + id, { method: 'DELETE' }).then(function () {
          showToast('分类已删除', 'success');
          loadCategories();
        }).catch(function (err) {
          showToast(err.message || '删除失败', 'error');
        });
      });
    }

    document.getElementById('type-filter').addEventListener('change', renderTable);
    loadCategories();
  </script>
</body>
</html>
