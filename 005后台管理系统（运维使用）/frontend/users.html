<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - 后台管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><h1>后台管理系统</h1><p>运维管理平台</p></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-page="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>数据总览</a>
        <a href="users.html" class="nav-item active" data-page="users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>用户管理</a>
        <a href="reserve-funds.html" class="nav-item" data-page="reserve-funds.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>储备金管理</a>
        <a href="transactions.html" class="nav-item" data-page="transactions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>账单数据</a>
        <a href="categories.html" class="nav-item" data-page="categories.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>分类管理</a>
      </nav>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left"><span class="topbar-title">用户管理</span></div>
        <div class="topbar-right">
          <span class="topbar-user"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span id="admin-name">管理员</span></span>
          <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
      </header>
      <div class="page-content">
        <!-- 搜索栏 -->
        <div class="filter-bar">
          <input type="text" class="form-input" id="search-input" placeholder="搜索用户名/昵称..." style="width:240px">
          <select class="form-select" id="page-size-select" style="width:120px">
            <option value="10">10条/页</option>
            <option value="20" selected>20条/页</option>
            <option value="50">50条/页</option>
          </select>
        </div>
        <!-- 表格 -->
        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th><th>用户名</th><th>昵称</th><th>头像</th><th>状态</th><th>账单数</th><th>总支出</th><th>注册时间</th><th>最近登录</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="user-tbody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw '';
    var currentPage = 1;
    var pageSize = 20;
    var keyword = '';

    function loadUsers() {
      var tbody = document.getElementById('user-tbody');
      showLoading(tbody);
      var url = '/users?page=' + currentPage + '&pageSize=' + pageSize;
      if (keyword) url += '&keyword=' + encodeURIComponent(keyword);

      apiFetch(url).then(function (data) {
        if (data.list.length === 0) { showEmpty(tbody, '暂无用户'); document.getElementById('pagination').innerHTML = ''; return; }
        var html = '';
        data.list.forEach(function (u) {
          html += '<tr>';
          html += '<td>' + u.id + '</td>';
          html += '<td>' + u.username + '</td>';
          html += '<td>' + u.nickname + '</td>';
          html += '<td><span class="avatar-dot ' + u.avatar + '"></span>' + u.avatar + '</td>';
          html += '<td><span class="badge ' + (u.status === 1 ? 'badge-success' : 'badge-danger') + '">' + formatStatus(u.status) + '</span></td>';
          html += '<td>' + u.txCount + '</td>';
          html += '<td class="amount-expense">' + formatAmount(u.totalExpense) + '</td>';
          html += '<td>' + formatDate(u.createdAt) + '</td>';
          html += '<td>' + (u.lastLoginAt ? formatDate(u.lastLoginAt) : '-') + '</td>';
          html += '<td><button class="btn-link" onclick="viewUser(' + u.id + ')">查看详情</button></td>';
          html += '</tr>';
        });
        tbody.innerHTML = html;
        renderPagination(document.getElementById('pagination'), data.total, data.page, data.pageSize, function (p) {
          currentPage = p;
          loadUsers();
        });
      }).catch(function (err) {
        showEmpty(tbody, '加载失败：' + err.message);
      });
    }

    function viewUser(id) {
      location.href = 'user-detail.html?id=' + id;
    }

    // 搜索防抖
    document.getElementById('search-input').addEventListener('input', debounce(function () {
      keyword = this.value.trim();
      currentPage = 1;
      loadUsers();
    }, 300));

    document.getElementById('page-size-select').addEventListener('change', function () {
      pageSize = Number(this.value);
      currentPage = 1;
      loadUsers();
    });

    loadUsers();
  </script>
</body>
</html>
