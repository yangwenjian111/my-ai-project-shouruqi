<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据总览 - 后台管理系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>后台管理系统</h1>
        <p>运维管理平台</p>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item active" data-page="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          数据总览
        </a>
        <a href="users.html" class="nav-item" data-page="users.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          用户管理
        </a>
        <a href="reserve-funds.html" class="nav-item" data-page="reserve-funds.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          储备金管理
        </a>
        <a href="transactions.html" class="nav-item" data-page="transactions.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          账单数据
        </a>
        <a href="categories.html" class="nav-item" data-page="categories.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          分类管理
        </a>
      </nav>
    </aside>

    <!-- 主内容 -->
    <div class="main-content">
      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <span class="topbar-title">数据总览</span>
        </div>
        <div class="topbar-right">
          <span class="topbar-user">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span id="admin-name">管理员</span>
          </span>
          <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
      </header>

      <!-- 页面内容 -->
      <div class="page-content" id="page-content">
        <div class="loading"><div class="loading-spinner"></div><p>加载中...</p></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
  <script>
    if (!checkAuth()) throw '';

    apiFetch('/dashboard').then(function (data) {
      var html = '';

      // 统计卡片
      html += '<div class="stats-grid">';
      html += statCard('用户总数', data.totalUsers, '今日新增 ' + data.todayNewUsers, 'blue', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>');
      html += statCard('账单总数', data.totalTransactions, '今日新增 ' + data.todayTransactions, 'green', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>');
      html += statCard('系统总支出', formatAmount(data.totalExpense), '本月 ' + formatAmount(data.monthExpense), 'red', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>');
      html += statCard('储备金总额', formatAmount(data.reserveTotal), '当月', 'yellow', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8v4h8V3z"/></svg>');
      html += '</div>';

      // 快捷入口
      html += '<div class="card"><div class="card-header"><h3>快捷入口</h3></div><div class="card-body"><div class="quick-links">';
      html += '<a href="users.html" class="quick-link"><div class="quick-link-icon" style="background:#DBEAFE;color:#3B82F6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div><span class="quick-link-text">用户管理</span></a>';
      html += '<a href="reserve-funds.html" class="quick-link"><div class="quick-link-icon" style="background:#FEF3C7;color:#F59E0B"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></div><span class="quick-link-text">储备金管理</span></a>';
      html += '<a href="transactions.html" class="quick-link"><div class="quick-link-icon" style="background:#D1FAE5;color:#10B981"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><span class="quick-link-text">账单数据</span></a>';
      html += '<a href="categories.html" class="quick-link"><div class="quick-link-icon" style="background:#E8DFF5;color:#7C3AED"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div><span class="quick-link-text">分类管理</span></a>';
      html += '</div></div></div>';

      // 分类统计
      html += '<div class="card" style="margin-top:16px"><div class="card-header"><h3>分类总数</h3></div><div class="card-body"><p style="font-size:32px;font-weight:700;color:var(--primary)">' + data.totalCategories + '</p><p style="font-size:13px;color:var(--text-secondary);margin-top:4px">系统预设分类数量</p></div></div>';

      document.getElementById('page-content').innerHTML = html;
    }).catch(function (err) {
      document.getElementById('page-content').innerHTML = '<div class="empty-state"><p>加载失败：' + err.message + '</p></div>';
    });

    function statCard(label, value, sub, color, icon) {
      return '<div class="stat-card">' +
        '<div class="stat-icon ' + color + '">' + icon + '</div>' +
        '<div class="stat-info">' +
        '<div class="stat-label">' + label + '</div>' +
        '<div class="stat-value">' + value + '</div>' +
        '<div class="stat-sub">' + sub + '</div>' +
        '</div></div>';
    }
  </script>
</body>
</html>
