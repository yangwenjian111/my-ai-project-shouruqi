<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账单 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page app-page active">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>
      
      <div class="content">
        <!-- 页面标题 -->
        <div class="header">
          <h2 class="page-title">账单</h2>
          <button class="search-btn">
            <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="9" cy="9" r="6" stroke="#4A3728" stroke-width="1.5" fill="none"/><line x1="13.5" y1="13.5" x2="17" y2="17" stroke="#4A3728" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        
        <!-- 月份选择器 -->
        <div class="month-picker">
          <button class="nav-arrow">‹</button>
          <span class="month-text">2026年9月</span>
          <button class="nav-arrow">›</button>
        </div>
        
        <!-- 筛选标签 -->
        <div class="filter-row">
          <button class="filter-tag active">全部</button>
          <button class="filter-tag">支出</button>
          <button class="filter-tag">收入</button>
        </div>
        
        <!-- 账单列表 -->
        <div class="transaction-list">
          <!-- 9月20日 -->
          <div class="tx-date-group">
            <div class="tx-date">9月20日 周日</div>
            <div class="tx-summary">支出 ¥77.00</div>
          </div>
          
          <div class="transaction-item">
            <div class="tx-icon" style="background:#FDDDE6">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 8l2-4h6l2 4v7a1 1 0 01-1 1H6a1 1 0 01-1-1V8z" fill="#E8849E"/></svg>
            </div>
            <div class="tx-info">
              <div class="tx-name">餐饮</div>
              <div class="tx-note">晚餐 · 火锅</div>
            </div>
            <div class="tx-amount expense">-¥45.00</div>
          </div>
          
          <div class="transaction-item">
            <div class="tx-icon" style="background:#FDDDE6">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 5h10l2 10H3L5 5z" fill="#E8849E"/><path d="M7 5V3a3 3 0 016 0v2" stroke="#E8849E" stroke-width="1.5" fill="none"/></svg>
            </div>
            <div class="tx-info">
              <div class="tx-name">购物</div>
              <div class="tx-note">水果</div>
            </div>
            <div class="tx-amount expense">-¥32.00</div>
          </div>
          
          <!-- 9月19日 -->
          <div class="tx-date-group">
            <div class="tx-date">9月19日 周六</div>
            <div class="tx-summary">收入 ¥200.00</div>
          </div>
          
          <div class="transaction-item">
            <div class="tx-icon" style="background:#D5F5E8">
              <svg width="20" height="20" viewBox="0 0 20 20"><rect x="4" y="6" width="12" height="10" rx="2" fill="#B8E6D0"/><path d="M7 6V4a3 3 0 016 0v2" stroke="#B8E6D0" stroke-width="1.5" fill="none"/></svg>
            </div>
            <div class="tx-info">
              <div class="tx-name">兼职</div>
              <div class="tx-note">外卖配送</div>
            </div>
            <div class="tx-amount income">+¥200.00</div>
          </div>
        </div>
      </div>
      
      <!-- 底部导航 -->
      <div class="bottom-nav">
        <div class="nav-pill">
          <a href="dashboard.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 01-1 1H4a1 1 0 01-1-1v-9z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
            <span>首页</span>
          </a>
          <a href="transactions.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/><line x1="8" y1="9" x2="16" y2="9" stroke="#fff" stroke-width="1.5"/><line x1="8" y1="13" x2="14" y2="13" stroke="#fff" stroke-width="1.5"/></svg>
            <span>账单</span>
          </a>
          <a href="statistics.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>统计</span>
          </a>
          <a href="budget.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="4" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>预算</span>
          </a>
          <a href="settings.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>设置</span>
          </a>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
