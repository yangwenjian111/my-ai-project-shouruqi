<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 日常记账</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="phone-frame">
    <div class="page login-page active">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 8c4-4 10-4 14 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M4 10c2-2 6-2 8 0" stroke="#4A3728" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12"><rect x="1" y="1" width="18" height="10" rx="2" stroke="#4A3728" stroke-width="1.5" fill="none"/><rect x="20" y="4" width="3" height="4" rx="1" fill="#4A3728"/><rect x="3" y="3" width="12" height="6" rx="1" fill="#4A3728"/></svg>
        </div>
      </div>

      <!-- 内容区 -->
      <div class="login-container">
        <!-- Logo -->
        <div class="login-logo">
          <div class="logo-icon">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
              <rect x="6" y="10" width="24" height="16" rx="3" stroke="white" stroke-width="2"/>
              <line x1="6" y1="16" x2="30" y2="16" stroke="white" stroke-width="2"/>
            </svg>
          </div>
        </div>

        <!-- 应用名 -->
        <h1 class="login-title">日常记账</h1>

        <!-- 欢迎语 -->
        <p class="login-welcome">欢迎回来，开始今天的记账吧</p>

        <!-- 间隔 -->
        <div class="spacer"></div>

        <!-- 表单 -->
        <div class="login-form">
          <!-- 用户名输入框 -->
          <div class="input-group">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7" r="4" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M3 17c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="#9C8578" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" placeholder="用户名" id="login-username">
          </div>

          <!-- 密码输入框 -->
          <div class="input-group">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <rect x="5" y="9" width="10" height="8" rx="1.5" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M7 9V6a3 3 0 016 0v3" stroke="#9C8578" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="password" placeholder="密码" id="login-password">
            <span class="input-action">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="3" stroke="#9C8578" stroke-width="1.5"/>
                <path d="M2 10c0-4.42 3.58-8 8-8s8 3.58 8 8-3.58 8-8 8-8-3.58-8-8z" stroke="#9C8578" stroke-width="1.5"/>
              </svg>
            </span>
          </div>

          <!-- 登录按钮 -->
          <button class="btn-login" onclick="handleLogin()">登录</button>
        </div>

        <!-- 忘记密码行 -->
        <div class="forgot-row">
          <a href="#" class="link-forgot">忘记密码？</a>
        </div>

        <!-- 注册入口 -->
        <a href="register.html" class="link-register">还没有账号？立即注册</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
